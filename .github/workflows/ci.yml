name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://trust:trust@localhost:5432/trust
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      ADMIN_API_KEY: ci-admin-api-key-at-least-32-characters
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trust
          POSTGRES_PASSWORD: trust
          POSTGRES_DB: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
